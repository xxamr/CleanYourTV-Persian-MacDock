name: Build verification (not a public signed release)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            launcher/**/*.gradle*
            launcher/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Run build
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew testReleaseUnitTest lintRelease assembleRelease --no-daemon --console=plain
      # No APK upload or release publishing. Release remains unsigned without protected signing secrets.
