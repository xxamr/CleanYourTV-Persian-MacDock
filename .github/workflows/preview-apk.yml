name: Experimental APK (manual, temporary signing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    if: github.repository == 'xxamr/CleanYourTV-Persian-MacDock' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: launcher/**/*.gradle*
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Test, lint and build isolated preview
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testPreviewUnitTest lintPreview assemblePreview
      - name: Verify package and signature, record provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp launcher/app/build/outputs/apk/preview/app-preview.apk dist/CleanYourTV-experimental.apk
          TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$TOOLS/aapt" dump badging dist/CleanYourTV-experimental.apk > /tmp/apk-badging.txt
          grep -q "package: name='com.gathin.tvhome.preview'" /tmp/apk-badging.txt
          grep -q "launchable-activity: name='com.gathin.tvhome.MainActivity'" /tmp/apk-badging.txt
          "$TOOLS/apksigner" verify --verbose --print-certs dist/CleanYourTV-experimental.apk > /tmp/apk-signature.txt
          {
            echo "EXPERIMENTAL - temporary debug certificate - not Stable"
            echo "Source commit: $SOURCE_SHA"
            echo "Application ID: com.gathin.tvhome.preview"
            echo "Activity: com.gathin.tvhome.MainActivity"
            echo "Java 17; Android API 34; build-tools 34.0.0"
            echo "testPreviewUnitTest, lintPreview, assemblePreview passed."
            echo "No physical TV install/update/rollback testing performed."
            echo "Different CI runs may use different signing keys; updates are not guaranteed."
            cat /tmp/apk-signature.txt
          } > dist/BUILD-INFO.txt
          cp docs/EXPERIMENTAL_APK.md dist/INSTALL-EXPERIMENTAL.md
          (cd dist && sha256sum CleanYourTV-experimental.apk > SHA256SUMS.txt)
      - name: Publish experimental prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="experimental-${SOURCE_SHA:0:7}-${RUN_NUMBER}-${RUN_ATTEMPT}"
          sed -e "s/27e5fec2073ea621ff6f32db7760c0d79ea2f207/$SOURCE_SHA/g" -e 's/این ویرایش فقط راهنما را فارسی می‌کند؛ فایل APK عوض نشده است.//g' docs/RELEASE_NOTES_PREVIEW_FA.md > /tmp/preview-release.md
          printf '\nشناسه سورس این ساخت: `%s`\n' "$SOURCE_SHA" >> /tmp/preview-release.md
          gh release create "$TAG" dist/* --repo "$REPO" --target "$SOURCE_SHA" --prerelease --latest=false --title "APK آزمایشی — ${SOURCE_SHA:0:7}" --notes-file /tmp/preview-release.md
